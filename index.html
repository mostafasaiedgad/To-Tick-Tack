<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>To-Tick-Tack</title>
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width", intial-scale="1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="icon" type="image/svg+xml" href="http://www.w3.org/2000/svg">
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <i class="bi bi-patch-check-fill"></i>
                <a href="#">To Tick Tack</a>
            </div>
            <div class="close-icon" id="close-web-btn">
                <i class="fa-solid fa-x"></i>
            </div>
        </header>

        <section class="container">

            <aside class="sidebar">
                <nav class="navigation">
                    <ul id="nav-ul">
                        <li class="myday-aside" id="myday-aside">
                            <i class="bi bi-brightness-high"></i>
                            <p>My Day</p>
                        </li>
                        <li class="important-aside" id="important-aside">
                            <i class="fa-regular fa-star"></i>
                            <p>Important</p>
                        </li>
                        <li class="planned-aside" id="planned-aside">
                            <i class="fa-solid fa-calendar-check"></i>
                            <p>Planned</p>
                        </li>
                        <li class="tasks-aside" id="tasks-aside">
                            <i class="fa-solid fa-house"></i>
                            <p>Tasks</p>
                        </li>
                    </ul>
                </nav>

                <div class="block-new-list-btn">
                    <button class="new-list-btn" id="new-list-btn">
                        <i class="fa-solid fa-plus"></i>
                        <p>New List</p>
                    </button>
                </div>
            </aside>

            <section class="main">
                <div class="main-body" id="main-body">
                    <div class="header-main">
                        <h3>My Day</h3>
                        <span id="current-date"></span>
                    </div>

                    <div class="main-inner">
                        <div class="main-icon">
                            <img src="imgs/calendar.png" alt="imgage loading" class="main-image">
                            <div class="main-text">
                                <h4>Focus on Your Day</h4>
                                <p>Get Things done with My Day, a list</p> 
                                <p> that refreshes every day.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="task-input-container">
                    <div class="task-input-wrapper">
                        <div class="task-check-box"></div>
                        <input type="text" class="task-input" id="task-input" placeholder="Try Typing">
                    </div>
                </div>
            </section>
        </section>

        <script src="script.js"></script>
    </body>
</html>
